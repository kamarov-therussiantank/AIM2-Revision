#				Инструкция к файлу опций.
#   Строка, начинающаяся с "#" - это комментарий. Таких строк может быть сколько угодно в файле.
#   Пустых строк и строк со всякой белибердой быть не должно,
# впрочем, программа на них не сломается, а просто пропустит.
#   Если программа хоть одну строку не поймет, она пожалуется вам, что что-то не понятно.
#   Если вас это будет волновать, запустите программу, подав ей только файл опций,
# она вам напишет, что конкретно ей не понравилось в этом файле.
#   Если какой-то опции нет, или же нет всего файла опций, используются дефолтные значения для
# каждой отсутствующей опции. Если одна и та же опция встречается несколько раз, то используется значение, 
# которое встретилось последним. 
#
#   Опций программа поддерживает пока только четыре штуки.
#   Их дефолтные значения представлены ниже(кроме опции "output", ниже представлен пример, а не 
# дефолтное значение), каждую опцию предваряет комментарий, объясняющий, чего она дает, а так же
# определяющий, как правильно эту опцию записать. Сами опции в файле могут располагаться в любом порядке.
#========================================================
#   Итак, следующая опция задает точность. Надо писать именно так, маленькими буквами и без пробелов,
# иначе не получится.
#
precision=6
#========================================================
#   Следующая опция задает путь для выходных файлов. Если не существует, то будет создан.
#   Обратите внимание, что после пути никаких дополнительных символов (пробелов в том числе) не должно
# быть, иначе они либо попадут в имя директории, либо вообще вызовут ексепшн, в этом случае программа
# за себя не отвечает. Кстати, это касается всех опций. После опции - сразу "Ентер".
#   Если вам не нужна эта фича, то просто закомментируйте (поставьте "#" в начале строки)
# эту опцию, или вообще не пишите. Тогда выходные файлы окажутся там же, где и исходные.
#
#output=C:\GGG
#========================================================
#   Следующая опция задает метод, который нужно использовать при конвертации файлов.
#   Всего есть два метода, и, соответственно, два значения опции: быстрый (fast), и медленный(slow).
#   Если вы не знаете, какой использовать, попробуйте все, благо их всего два. Если вам интересна
# разница между ними, спросите у Разума.
#
method=fast
#========================================================
#   Последняя опция определяет, что делать с исходными файлами(*.mod). Может, они наф больше не нужны?
#   Тогда ставим опции значение "y", что означает "yeah, baby!", и файлы со свистом улетают с диска.
#   Если же нам они дороги, как память, ставим "n", что означает "Nет, только не это!", и с ними
# все будет в порядке.
#
delete=n
#========================================================