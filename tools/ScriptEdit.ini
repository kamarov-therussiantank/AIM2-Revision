[MAIN]
ScriptDir="Data\Scripts"
EnumSeparator=" "
KeywordSeparator=" (),;:{}	"
StringColor	 = 0x800000
NumericColor = 0x808000
CommentColor = 0xC0C0C0
EnumGroupName="DataTypes Operations Constructions Functions Operators ReservedWords GameFunctions Directive"

[Directive]
EnumKeyword	= "#include #define"
SensitivityCase = 1


[DataTypes]
Name		= "Типы данных"
GroupForeColor	= 0x1E90FF
GroupBackColor	= 0xFFFFEE
EnumKeyword	= "char int float void"

[Operations]
EnumKeyword	="== != ! && || > < >= <="

[Constructions]
GroupForeColor	= 0x1E90FF
EnumKeyword	="proc if else while case switch return"

[Functions]
EnumKeyword	="WRITE WRITELN"

[Operators]
EnumKeyword	="inc dec"

[ReservedWords]
EnumKeyword	=""

[GameFunctions]
GroupForeColor	= 0x008000
EnumKeyword	="GetEvent SetEvent StartStript Text GetObjVar SetObjVar"
